[project]
name = "probrow"
version = "0.1.0"
description = "proBrow: lightweight local genome browser for strand-specific PRO-seq bigWig + genes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pybigwig>=0.3.22",
  "numpy>=1.24",
]

[project.optional-dependencies]
bundle = [
  "pyinstaller>=6.0"
]
autocomplete = [
  "argcomplete>=3.3",
]
config = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
probrow = "app.cli:main"

[tool.uv]
dev-dependencies = []

